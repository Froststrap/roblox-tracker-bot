root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/rbxwatch ."
bin = "./tmp/rbxwatch"
full_bin = "./tmp/rbxwatch"
include_ext = ["go"]
exclude_dir = ["tmp", ".git", "vendor"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
